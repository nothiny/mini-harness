[package]
name = "mini-harness-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "JSONL protocol server for mini-harness (optional companion crate)"

[dependencies]
mini-harness = { path = ".." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["clock"] }
