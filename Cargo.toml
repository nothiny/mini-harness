[package]
name = "mini-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A minimal, cancellable, crash-recoverable agent harness runtime"
repository = "https://github.com/nothiny/mini-harness"

[lints.rust]
future_incompatible = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
# Keep the baseline intentionally small and passing: CI denies all warnings,
# so every lint listed here must hold for the current code (tests included).
# Candidates for later, once test helpers migrate off `unwrap!`-heavy
# assertions: `unwrap_used`, `print_stdout`, `print_stderr`.
todo = "warn"
unimplemented = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "fs", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
fs2 = "0.4"
sha2 = "0.11.0"
libc = "0.2.189"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
