name: Publish tutorial

# Publish explicitly when the tutorial is ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install mdBook
        run: cargo install mdbook --version 0.4.51 --locked
      - name: Build tutorial
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_path }}/
        run: mdbook build
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
