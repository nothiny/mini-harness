name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  baseline:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Baseline commands from docs/implementation-plan.md §3.3. A dependency
      # or platform that cannot satisfy the strict clippy pass must be
      # recorded there instead of being relaxed silently here.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The tutorial (docs/tutorial) documents the pre-simplification
      # architecture (see the `bak` branch), so its source-path references
      # no longer resolve on this branch. Docs checking is disabled until
      # the tutorial is rewritten for the simplified core.
